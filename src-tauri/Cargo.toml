[package]
name = "markitdown-desktop"
version = "1.1.0"
description = "Converts documents to Markdown locally with Microsoft MarkItDown"
authors = ["MHabachia"]
license = "MIT"
repository = "https://github.com/MHabachia/markitdown-desktop"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-updater = "2.13"
tauri-plugin-process = "2.4"
getrandom = "0.3"
