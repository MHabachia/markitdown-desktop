version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: pip
    directory: /
    schedule: { interval: monthly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: monthly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
