name: Fehler melden
description: Etwas funktioniert nicht wie erwartet
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Was ist passiert?
      description: Was hast du gemacht, was hast du erwartet, was kam stattdessen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App-Version
      description: Steht unter „Über MarkItDown“.
      placeholder: "1.1.1"
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options: [macOS, Windows]
    validations:
      required: true
  - type: input
    id: file-type
    attributes:
      label: Dateityp
      description: Falls es um eine bestimmte Datei geht, z. B. PDF oder Excel.
  - type: textarea
    id: log
    attributes:
      label: Auszug aus backend.log
      description: "macOS: ~/Library/Logs/io.github.mhabachia.markitdown/backend.log · Windows: %LOCALAPPDATA%\\io.github.mhabachia.markitdown\\logs\\backend.log"
      render: text
